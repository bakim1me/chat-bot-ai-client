<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Sidebar Settings Panel -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>설정</h2>
            </div>
            
            <div class="setting-group">
                <div class="setting-row">
                    <label for="useLlmToggle">Gemini 사용여부</label>
                    <label class="switch">
                        <input type="checkbox" id="useLlmToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-row">
                    <label for="topKSlider">Top-K</label>
                    <span id="topKValue" class="value-display">5</span>
                </div>
                <input type="range" id="topKSlider" min="1" max="10" step="1" value="5">
            </div>

            <div class="setting-group">
                <div class="setting-row">
                    <label for="scoreThresholdSlider">Score Threshold</label>
                    <span id="scoreThresholdValue" class="value-display">0.5</span>
                </div>
                <input type="range" id="scoreThresholdSlider" min="0" max="1" step="0.1" value="0.5">
            </div>
        </aside>

        <!-- Chat Area -->
        <div class="chat-wrapper">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-info">
                    <div class="avatar">AI</div>
                    <div class="title">
                        <h1>학력개발 Assistant</h1>
                        <span class="status">Online</span>
                    </div>
                </div>
            </header>

            <!-- Chat Container -->
            <main class="chat-container" id="chatContainer">
                <div class="message-wrapper ai-wrapper">
                    <div class="message ai-message">안녕하세요! 대성학력개발연구소입니다. 무엇이 궁금하신가요?</div>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="input-container">
                <form id="chatForm" class="input-form">
                    <input type="text" id="userInput" placeholder="질문을 입력해주세요..." autocomplete="off" required>
                    <button type="submit" id="sendBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
